<!doctype html>
<!--
  "After a clip is finished" (#644) test harness for the Playwright e2e suite,
  same idea as finish-clips.html: not the app shell, just the DOM
  take_cleanup.js touches (the setting, the themed confirm, the Render tab's
  take-delete bar), with Tauri's IPC and events mocked (vite.config.e2e.js).
  A test plays the backend with `window.__mockEmit`.
-->
<html>
<head>
  <meta charset="UTF-8" />
  <title>Take cleanup test harness</title>
</head>
<body>
  <select id="config-take-after-finish">
    <option value="keep">Keep the take</option>
    <option value="recycle">Move the take to the Recycle Bin</option>
    <option value="delete">Delete the take permanently</option>
  </select>
  <input type="checkbox" id="config-take-delete-when-needed" disabled />
  <label for="config-take-delete-when-needed">Only when space is needed</label>
  <p id="config-take-after-finish-hint"></p>

  <div id="render-take-delete-progress" style="display: none; align-items: center; gap: 6px;">
    <div class="progress-bar-container" style="width: 140px;"><div class="progress-bar-fill" style="width: 0%;"></div></div>
    <span id="render-take-delete-progress-label"></span>
  </div>

  <div id="themed-confirm-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <h2 id="themed-confirm-title">Confirm</h2>
      <p id="themed-confirm-message"></p>
      <button id="themed-confirm-ok-btn">Confirm</button>
      <button id="themed-confirm-cancel-btn">Cancel</button>
    </div>
  </div>

  <script type="module">
    import { initThemedConfirm } from '../../src/themed_confirm.js';
    import { initTakeCleanup, setTakeCleanupSetting, getTakeCleanupSetting } from '../../src/take_cleanup.js';

    window.__testSettingsChangeCount = 0;
    initThemedConfirm();
    // Loaded before the wiring, as main.js's boot order does.
    const saved = new URLSearchParams(location.search).get('saved');
    if (saved) setTakeCleanupSetting(saved, true);
    initTakeCleanup({ onSettingsChange: () => { window.__testSettingsChangeCount += 1; } });

    window.__getSetting = () => getTakeCleanupSetting();
    window.__cleanupReady = true;
  </script>
</body>
</html>
