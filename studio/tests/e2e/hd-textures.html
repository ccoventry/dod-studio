<!doctype html>
<!--
  Minimal harness for hd_pane.js (#372) -- see tests/e2e/README.md for the
  general shape. Carries only the elements the pane reads and writes, plus the
  Configuration page's hl.exe field it takes the game path from. A test
  controls the backend by registering `hd_status` / `hd_setup_tools` /
  `hd_build` / `hd_set_python` / `hd_misses` / `hd_save_style` / `hd_preview` handlers on window.__mockInvokeHandlers; the
  file picker is `plugin:dialog|open`, which goes through the same mock.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>hd_pane.js test harness</title>
</head>
<body>
  <input id="hl-path-input" value="C:/games/Half-Life/hl.exe" />
  <button class="nav-tab-btn" data-nav="hd-textures">HD Textures</button>

  <p id="hd-status-text"></p>
  <button id="hd-refresh-btn">Refresh</button>
  <table><thead id="hd-status-head"></thead><tbody id="hd-status-body"></tbody></table>
  <select id="hd-style-select"></select>
  <button id="hd-copy-cfg-btn">Copy</button>
  <pre id="hd-cfg-lines"></pre>
  <p id="hd-tools-text"></p>
  <button id="hd-setup-btn">Download</button>
  <button id="hd-setup-cancel-btn" disabled>Cancel</button>
  <button id="hd-upscaler-pick-btn">Choose upscaler folder...</button>
  <button id="hd-upscaler-reset-btn">Find it automatically</button>
  <p id="hd-python-text"></p>
  <button id="hd-python-pick-btn">Choose python.exe...</button>
  <button id="hd-python-reset-btn">Find it automatically</button>
  <p id="hd-setup-progress"></p>
  <div id="hd-build-styles"></div>
  <div id="hd-build-types"></div>
  <button id="hd-build-btn">Build</button>
  <button id="hd-build-cancel-btn" disabled>Cancel</button>
  <p id="hd-build-progress"></p>
  <p id="hd-build-line"></p>
  <pre id="hd-realesrgan-line"></pre>
  <select id="hd-preview-map"></select>
  <div id="hd-preview-styles"></div>
  <button id="hd-preview-btn">Show comparison</button>
  <p id="hd-preview-text"></p>
  <div id="hd-preview-wrap" hidden><img id="hd-preview-img" alt="" /></div>
  <p id="hd-my-styles-text"></p>
  <ul id="hd-my-styles-list"></ul>
  <input id="hd-style-name" />
  <select id="hd-style-kind">
    <option value="plain">plain</option>
    <option value="ai">ai</option>
    <option value="blend">blend</option>
  </select>
  <div data-style-kind="plain"><input id="hd-style-sharpening" type="number" value="60" /></div>
  <div data-style-kind="ai" hidden><select id="hd-style-model"></select></div>
  <p id="hd-style-model-hint" data-style-kind="ai" hidden></p>
  <div data-style-kind="blend" hidden>
    <input id="hd-style-percent" type="number" value="50" />
    <select id="hd-style-a"></select>
    <select id="hd-style-b"></select>
  </div>
  <pre id="hd-style-line"></pre>
  <button id="hd-style-save-btn">Save style</button>
  <p id="hd-style-message"></p>
  <button id="hd-misses-btn">Read the game's log</button>
  <pre id="hd-misses-command"></pre>
  <button id="hd-misses-copy-btn">Copy</button>
  <p id="hd-misses-text"></p>
  <input type="checkbox" id="hd-misses-on-purpose" />
  <div id="hd-misses-maps"></div>
  <div id="footer-hd-summary"></div>
  <div id="toast-container"></div>

  <script type="module">
    import { initHdPane } from '/src/hd_pane.js';
    initHdPane();
    window.__harnessReady = true;
  </script>
</body>
</html>
