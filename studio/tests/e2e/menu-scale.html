<!DOCTYPE html>
<!--
  Harness for menu_scale_setting.js (#985): Configuration > Paths' "Size the
  Game's Menus Like the Pre-Anniversary Engine". The backend's
  menu_scale_status and set_menu_scale are window.__mockInvokeHandlers.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>menu_scale_setting.js test harness</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <input type="text" id="hl-path-input" value="" hidden />
  <div class="inline-controls" id="config-menu-scale-row" style="display: none;">
    <div class="control-group">
      <input type="checkbox" id="config-menu-scale" disabled />
      <label for="config-menu-scale">Size the Game's Menus Like the Pre-Anniversary Engine</label>
    </div>
  </div>
  <div id="toast-container"></div>
  <script type="module">
    import { createMenuScaleSetting } from '/src/menu_scale_setting.js';
    const input = document.querySelector('#hl-path-input');
    window.__start = async ({ hlPath = '', gameFolder = 'dod' } = {}) => {
      input.value = hlPath;
      const setting = createMenuScaleSetting({ getHlPath: () => input.value.trim(), getGameFolder: () => gameFolder });
      window.__refresh = () => setting.refresh();
      await setting.refresh();
    };
    window.__harnessReady = true;
  </script>
</body>
</html>
