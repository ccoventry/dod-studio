<!DOCTYPE html>
<!--
  Harness for the Demo Analyzer's Explorer tree (#572): the sidebar and demo
  table analyzer_pane.js queries, with browse_directory answered from a small
  fake drive (window.__mockInvokeHandlers, tests/e2e/mocks/tauri-core.js).
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>analyzer_pane.js Explorer tree harness</title>
</head>
<body>
  <div id="analyzer-quick-links"></div>
  <button id="analyzer-tree-refresh-btn">Refresh</button>
  <div id="analyzer-tree"></div>
  <table id="analyzer-demo-table"><tbody id="analyzer-demo-tbody"></tbody></table>
  <div id="analyzer-tab-content"></div>

  <script type="module">
    const folders = {
      'D:\\': ['D:\\Program Files (x86)', 'D:\\Users'],
      'D:\\Program Files (x86)': ['D:\\Program Files (x86)\\Steam'],
      'D:\\Program Files (x86)\\Steam': [],
      'D:\\Users': ['D:\\Users\\chris'],
      'D:\\Users\\chris': [],
    };
    // Demos by folder: names only, as browse_directory lists them.
    const demos = { 'D:\\Users\\chris': ['a.dem', 'x.dem'] };
    const entry = (path) => ({ name: path.split('\\').filter(Boolean).pop() || path, path, demo_count: 0 });
    const demo = (dir, name) => ({ name, path: `${dir}\\${name}`, size_bytes: 1, modified_unix_secs: 0, map_name: null, demo_type: 'POV' });
    window.__unreadable = new Set();
    // A folder in __held waits for window.__release[path]() before it lists:
    // a cloud folder nobody has opened.
    window.__held = new Set();
    window.__release = {};
    // read_demo_heads waits for window.__releaseHeads() while __holdHeads.
    window.__holdHeads = false;
    const heads = (paths) => paths.map((path) => ({ path, map_name: 'dod_anzio', demo_type: 'POV' }));
    const listing = (path) => ({ path, parent: null, subdirs: folders[path].map(entry), demos: (demos[path] || []).map((n) => demo(path, n)) });
    window.__mockInvokeHandlers = {
      browse_directory: ({ path }) => {
        if (path === null) return { path: null, parent: null, subdirs: [entry('D:\\')], demos: [] };
        if (!(path in folders) || window.__unreadable.has(path)) {
          return Promise.reject(new Error(`cannot read ${path}`));
        }
        if (window.__held.has(path)) {
          return new Promise((resolve) => { window.__release[path] = () => resolve(listing(path)); });
        }
        return listing(path);
      },
      read_demo_heads: ({ paths }) => {
        if (!window.__holdHeads) return heads(paths);
        return new Promise((resolve) => { window.__releaseHeads = () => resolve(heads(paths)); });
      },
      index_demo_players: () => 0,
      analyze_demo_full: () => new Promise(() => {}),
      default_browse_dir: () => null,
      scan_demo_folders: () => [],
    };
    const { initAnalyzerPane, openAnalyzerDemo } = await import('/src/analyzer_pane.js');
    initAnalyzerPane({ getPinnedFolders: () => [], getDemoFolderHistory: () => [] });
    window.__openDemo = openAnalyzerDemo;
    window.__harnessReady = true;
  </script>
</body>
</html>
