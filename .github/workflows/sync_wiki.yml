# Publishes docs/wiki/ (plus the Commands page generated from
# docs/dodstudio_commands.md) to the GitHub wiki, so wiki content goes through
# PR review like the rest of the repo (#355, decided D26: on push to main).
name: Sync wiki

on:
  push:
    branches: [main]
    paths:
      - docs/wiki/**
      - docs/dodstudio_commands.md
      - .github/scripts/build_wiki.py
      - .github/workflows/sync_wiki.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-wiki
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the wiki pages
        run: python3 .github/scripts/build_wiki.py "$RUNNER_TEMP/wiki-out"

      - name: Push them to the wiki repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki"
          # Only pages the build produced are replaced; any other page on the
          # wiki is left as it is.
          cp "$RUNNER_TEMP"/wiki-out/*.md "$RUNNER_TEMP/wiki/"
          cd "$RUNNER_TEMP/wiki"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Sync from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push
