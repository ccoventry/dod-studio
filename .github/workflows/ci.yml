# Nothing previously ran cargo test/the e2e suite on a PR — every check on
# this repo's history was run by hand, locally, before pushing. That means a
# merge only ever verified what its author remembered to run. Runs on
# windows-latest specifically, not the cheaper/faster ubuntu-latest: this
# codebase carries real #[cfg(windows)]-gated code (see CLAUDE.md's WASM/
# platform guardrails) and the app itself only ever runs on Windows, so a
# green check on Linux wouldn't actually prove the paths that matter compile
# or pass.
name: CI

on:
  pull_request:
    branches: [dev, main]
    # Deliberately no paths-ignore for **.md/docs/**: dev-protection's
    # ruleset requires these three checks by name on every PR, and GitHub
    # only skips a workflow when *every* changed file matches
    # paths-ignore. A PR that manages to do that would trigger no check
    # runs at all and sit stuck as "expected, waiting" with no way to
    # satisfy the rule short of a stub workflow -- cheaper to always run
    # than to carry that trap.
  # Runs on dev too, and that run is the only one that saves the Rust cache
  # (`save-if` below). GitHub scopes a cache to the ref that saved it: a PR can
  # restore its base branch's cache but never another PR's. With only PR runs,
  # dev never had one, so every PR compiled all ~400 crates from scratch --
  # "No cache found", 8-10 minutes a job -- and each saved ~900 MB nobody
  # could read, evicting the rest.
  push:
    branches: [dev]

jobs:
  rust-tests:
    name: Rust workspace tests
    runs-on: windows-latest
    env:
      # No debug info in test builds: nothing here reads it, and on Windows
      # generating and linking it is a real share of the build. Panic messages
      # still carry file:line.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      # studio's build script validates every `bundle.resources` entry
      # in tauri.conf.json exists on disk, and one of them is this 32-bit
      # companion DLL (goldsrc-hooks/README.md). GoldSrc is a 32-bit engine, so
      # it needs its own cross-build; the rest of the app is native 64-bit.
      #
      # Without this the WHOLE WORKSPACE fails to build here, not just the DLL's
      # own target -- a missing resource fails studio's build script,
      # and that gates the crate. `--release` because the resource path names
      # the release profile, matching release_experimental.yml / release_stable.yml.
      - name: Build goldsrc-hooks (32-bit DoD/GoldSrc companion DLL)
        run: cargo build -p goldsrc-hooks --release --target i686-pc-windows-msvc --locked

      - name: cargo test --workspace
        run: cargo test --workspace --locked

  clippy:
    name: Clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, unlike the test job above, which stays on `stable` on purpose --
      # a new Rust breaking the build is something we want to hear about. A lint
      # gate is different: every Rust release ships new clippy lints, so
      # `@stable` + `-D warnings` means a PR that was green yesterday goes red
      # today with nobody having touched the code. That happened on the first
      # run of this job (PR #232): local clippy was 1.96.1, CI's stable had
      # moved to 1.98.1, and `chunks_exact_to_as_chunks` -- new in 1.98 -- failed
      # it in eleven places.
      #
      # Bumping this is a deliberate act: raise the version, run it, fix or
      # allow what the new release found, in its own commit. To reproduce a
      # failure locally without changing your default toolchain:
      #
      #   rustup toolchain install 1.98.1 --component clippy --profile minimal
      #   rustup run 1.98.1 cargo clippy --workspace --all-targets -- -D warnings
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt
          targets: i686-pc-windows-msvc

      # First, and before the build: it needs no compile, so a formatting slip
      # fails in seconds instead of after a full clippy build. Same pinned
      # toolchain as clippy for the same reason -- rustfmt's output can shift
      # between releases. To fix locally: `rustup run 1.98.1 cargo fmt --all`.
      - name: cargo fmt --check
        run: cargo fmt --all --check

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      # studio's build script validates every `bundle.resources` entry
      # in tauri.conf.json exists on disk, and one of them is this 32-bit
      # companion DLL (goldsrc-hooks/README.md). GoldSrc is a 32-bit engine, so
      # it needs its own cross-build; the rest of the app is native 64-bit.
      #
      # Without this the WHOLE WORKSPACE fails to build here, not just the DLL's
      # own target -- a missing resource fails studio's build script,
      # and that gates the crate. `--release` because the resource path names
      # the release profile, matching release_experimental.yml / release_stable.yml.
      - name: Build goldsrc-hooks (32-bit DoD/GoldSrc companion DLL)
        run: cargo build -p goldsrc-hooks --release --target i686-pc-windows-msvc --locked

      # --all-targets so examples and test code are linted too: native/examples/
      # is where the R&D probes live, and letting them rot silently is how the
      # ~200 warnings this gate was introduced against accumulated.
      #
      # The allow-list lives in the root Cargo.toml under
      # [workspace.lints.clippy], one commented entry per judgement that clippy
      # is wrong for this codebase. Add there, with a reason, rather than
      # loosening this step.
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  frontend-tests:
    name: Frontend e2e tests
    runs-on: windows-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: studio/package-lock.json

      - run: npm ci

      # No `--with-deps`: on Windows it installs the Server-Media-Foundation
      # Windows feature, which took 3m20s of this job's 4m37s. The browser
      # download itself is ~17s, too little to be worth caching. Chromium
      # doesn't need that feature to run these tests.
      - run: npx playwright install chromium

      - run: npm run test:e2e
