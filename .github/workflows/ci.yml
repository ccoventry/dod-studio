# Nothing previously ran cargo test/the e2e suite on a PR — every check on
# this repo's history was run by hand, locally, before pushing. That means a
# merge only ever verified what its author remembered to run. Runs on
# windows-latest specifically, not the cheaper/faster ubuntu-latest: this
# codebase carries real #[cfg(windows)]-gated code (see CLAUDE.md's WASM/
# platform guardrails) and the app itself only ever runs on Windows, so a
# green check on Linux wouldn't actually prove the paths that matter compile
# or pass.
name: CI

on:
  pull_request:
    branches: [dev, main, tmp/ci-skip-test-base]
    # Deliberately no paths-ignore for **.md/docs/**: dev-protection's
    # ruleset requires these three checks by name on every PR, and GitHub
    # only skips a workflow when *every* changed file matches
    # paths-ignore. A PR that manages to do that would trigger no check
    # runs at all and sit stuck as "expected, waiting" with no way to
    # satisfy the rule short of a stub workflow -- cheaper to always run
    # than to carry that trap.
  # Runs on dev too, and that run is the only one that saves the Rust cache
  # (`save-if` below). GitHub scopes a cache to the ref that saved it: a PR can
  # restore its base branch's cache but never another PR's. With only PR runs,
  # dev never had one, so every PR compiled all ~400 crates from scratch --
  # "No cache found", 8-10 minutes a job -- and each saved ~900 MB nobody
  # could read, evicting the rest.
  push:
    branches: [dev]

# Checkout only. The Rust cache is saved with the runner's own token, not
# GITHUB_TOKEN, so read access is all this needs.
permissions:
  contents: read

jobs:
  # Which expensive jobs this run needs, from the files a PR changes
  # (.github/scripts/ci_changes.py has the areas and their reasons). A job whose
  # area is untouched is skipped by its `if:`, and GitHub reports a skipped job
  # as passing a required check, so a docs-only PR doesn't wait ~3 min on Rust
  # builds. Not workflow-level `paths`: a workflow that never starts leaves its
  # required checks "expected" for ever. Fails open: if this job fails, every
  # job runs (`needs.changes.result != 'success'` in each `if:`). Everything
  # runs on the push to dev, on PRs into main, and when a build input or CI
  # itself changes. Source checks and Frontend lint always run.
  #
  # The PR's merge commit has the base as its first parent, so a two-commit
  # checkout and `HEAD^1..HEAD` list exactly what the PR changes against its
  # base; `--no-renames` lists both sides of a rename.
  changes:
    name: Changed areas
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.areas.outputs.rust }}
      hooks: ${{ steps.areas.outputs.hooks }}
      frontend: ${{ steps.areas.outputs.frontend }}
      web_python: ${{ steps.areas.outputs.web_python }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Areas this run needs
        id: areas
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref == 'tmp/ci-skip-test-base' && 'dev' || github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only --no-renames HEAD^1 HEAD > "$RUNNER_TEMP/changed.txt"
          else
            : > "$RUNNER_TEMP/changed.txt"
          fi
          python3 .github/scripts/ci_changes.py --event "$EVENT" --base "$BASE" \
            --files "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"

  # The workspace's tests in three jobs side by side. As one job they took
  # ~5.5 minutes, the longest in CI, and ~3m40s of that was compiling: the
  # crates on the path analysis -> native -> native's tests, and the Tauri
  # app's lib and tests, all on one 4-core runner. Split by what each part
  # compiles: `native` and `studio` are the two long builds, `rest` is every
  # other crate (by exclusion, so a new crate is tested without a CI change).
  # Each part keeps its own Rust cache (`key` below).
  rust-tests-part:
    name: Rust tests (${{ matrix.part }})
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: windows-latest
    strategy:
      # Let every part finish, so one red run shows every failing part.
      fail-fast: false
      matrix:
        include:
          - part: native
            packages: -p native
          - part: studio
            packages: -p desktop-studio
          - part: rest
            packages: --workspace --exclude goldsrc-hooks --exclude native --exclude desktop-studio --exclude source-checks
    env:
      # No debug info in test builds: nothing here reads it, and on Windows
      # generating and linking it is a real share of the build. Panic messages
      # still carry file:line.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.part }}
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      # studio's build script (tauri-build) checks that every
      # `bundle.resources` entry in tauri.conf.json exists, and one is the
      # 32-bit hook DLL, at this checkout's own target/ path. Without the file
      # the whole workspace fails to build. Only its existence is checked and
      # no test reads it, so an empty file does: building the real release DLL
      # here cost 1-2 minutes per job. Hooks 32-bit builds and tests the real
      # one, and the release workflows build what ships. Only the studio part
      # builds the app.
      - name: Placeholder for the 32-bit hook DLL
        if: matrix.part == 'studio'
        shell: bash
        run: mkdir -p target/i686-pc-windows-msvc/release && touch target/i686-pc-windows-msvc/release/dodstudio_goldsrc_hooks.dll

      # goldsrc-hooks is left out of every part: Hooks 32-bit runs every one of
      # its tests as 32-bit, the build that ships, so compiling them again as
      # 64-bit here only lengthened the slowest job.
      #
      # --lib --bins --tests: a plain `cargo test` also builds and links every
      # example (114 R&D probes in native/ and analysis/), which run no tests;
      # Clippy's --all-targets still checks that they compile. The doc tests
      # (only dem-patch has any) run in a step of their own.
      - name: cargo test (${{ matrix.part }})
        run: cargo test ${{ matrix.packages }} --lib --bins --tests --locked

      - name: cargo test --doc (dem-patch)
        if: matrix.part == 'rest'
        run: cargo test -p dem --doc --locked

  # The "files in step" checks, which read source files and compile nothing:
  # file-size ceilings, a test fn that lost its #[test], the console-name table
  # and the crash-site table (20 of the last 30 red CI runs were one of these,
  # and each used to fail only after `native`'s ~3 minute compile). A crate of
  # its own with no dependencies, so the job is the checkout plus a ~10 s test
  # build and a red run answers in about a minute. Not a required check: the
  # rulesets get it only once this workflow is on dev (see CLAUDE.md).
  source-checks:
    name: Source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: cargo test (source-checks)
        run: cargo test -p source-checks --locked

  # The check the rulesets require by this name: green only when every part
  # passed, or when the parts were skipped because `changes` succeeded and found
  # no Rust change. Keeping the name means no ruleset change; a part that failed
  # or was cancelled turns it red.
  rust-tests:
    name: Rust workspace tests
    needs: [changes, rust-tests-part]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every part passed, or none was needed
        shell: bash
        env:
          PARTS: ${{ needs.rust-tests-part.result }}
          CHANGES: ${{ needs.changes.result }}
          NEEDED: ${{ needs.changes.outputs.rust }}
        run: |
          echo "parts: $PARTS, changes: $CHANGES, rust changed: $NEEDED"
          [ "$PARTS" = "success" ] || { [ "$PARTS" = "skipped" ] && [ "$CHANGES" = "success" ] && [ "$NEEDED" = "false" ]; }

  clippy:
    name: Clippy
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned, unlike the test job above, which stays on `stable` on purpose --
      # a new Rust breaking the build is something we want to hear about. A lint
      # gate is different: every Rust release ships new clippy lints, so
      # `@stable` + `-D warnings` means a PR that was green yesterday goes red
      # today with nobody having touched the code. That happened on the first
      # run of this job (PR #232): local clippy was 1.96.1, CI's stable had
      # moved to 1.98.1, and `chunks_exact_to_as_chunks` -- new in 1.98 -- failed
      # it in eleven places.
      #
      # Bumping this is a deliberate act: raise the version, run it, fix or
      # allow what the new release found, in its own commit. To reproduce a
      # failure locally without changing your default toolchain:
      #
      #   rustup toolchain install 1.98.1 --component clippy --profile minimal
      #   rustup run 1.98.1 cargo clippy --workspace --all-targets -- -D warnings
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt

      # First, and before the build: it needs no compile, so a formatting slip
      # fails in seconds instead of after a full clippy build. Same pinned
      # toolchain as clippy for the same reason -- rustfmt's output can shift
      # between releases. To fix locally: `rustup run 1.98.1 cargo fmt --all`.
      - name: cargo fmt --check
        run: cargo fmt --all --check

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      # studio's build script (tauri-build) checks that every
      # `bundle.resources` entry in tauri.conf.json exists, and one is the
      # 32-bit hook DLL, at this checkout's own target/ path. Without the file
      # the whole workspace fails to build. Only its existence is checked and
      # no test reads it, so an empty file does: building the real release DLL
      # here cost 1-2 minutes per job. Hooks 32-bit builds and tests the real
      # one, and the release workflows build what ships.
      - name: Placeholder for the 32-bit hook DLL
        shell: bash
        run: mkdir -p target/i686-pc-windows-msvc/release && touch target/i686-pc-windows-msvc/release/dodstudio_goldsrc_hooks.dll

      # --all-targets so examples and test code are linted too: native/examples/
      # is where the R&D probes live, and letting them rot silently is how the
      # ~200 warnings this gate was introduced against accumulated.
      #
      # The allow-list lives in the root Cargo.toml under
      # [workspace.lints.clippy], one commented entry per judgement that clippy
      # is wrong for this codebase. Add there, with a reason, rather than
      # loosening this step.
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The e2e suite in two shards on two runners: 561 tests took ~250 s on one
  # 4-core runner with 2 workers, ~200 s with 4 (the browsers and the Vite
  # server share the cores), and about half that per shard. The check the
  # rulesets require by the old name is the job below it.
  frontend-tests-shard:
    name: Frontend e2e shard ${{ matrix.shard }}
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true') }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: studio/package-lock.json

      - run: npm ci

      # No `--with-deps`: on Windows it installs the Server-Media-Foundation
      # Windows feature, which took 3m20s of this job's 4m37s. The browser
      # download itself is ~17s, too little to be worth caching. Chromium
      # doesn't need that feature to run these tests.
      - run: npx playwright install chromium

      - run: npx playwright test --shard=${{ matrix.shard }}/2

  # The check the rulesets require by this name: green only when both shards
  # passed, or were skipped with no frontend change (the same pattern as
  # `rust-tests`).
  frontend-tests:
    name: Frontend e2e tests
    needs: [changes, frontend-tests-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed, or none was needed
        shell: bash
        env:
          SHARDS: ${{ needs.frontend-tests-shard.result }}
          CHANGES: ${{ needs.changes.result }}
          NEEDED: ${{ needs.changes.outputs.frontend }}
        run: |
          echo "shards: $SHARDS, changes: $CHANGES, frontend changed: $NEEDED"
          [ "$SHARDS" = "success" ] || { [ "$SHARDS" = "skipped" ] && [ "$CHANGES" = "success" ] && [ "$NEEDED" = "false" ]; }

  # ESLint over studio/src (#1179): no-unused-vars as an error, max-params as a
  # warning, then the Vitest unit tests (#31). Its own parallel job on ubuntu
  # (no Windows code involved), so it adds no wall-clock time; npm is cached
  # the way the e2e job does. Runs on every PR, never skipped: the unit tests
  # are seconds, and several read Rust and web-analyzer files to check a
  # mirrored constant or copy, so no file area could safely skip them.
  frontend-lint:
    name: Frontend lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: studio/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run test:unit

  # The hook DLL ships as 32-bit, so its tests run here, as 32-bit, and only
  # here; Clippy above lints it as 64-bit too (it is a workspace member).
  # Three of its tests are `#[cfg(target_arch = "x86")]`, and its 32-bit-only
  # hook code is linted nowhere else. Its own job, in parallel with the others, so it adds no wall-clock
  # time: only goldsrc-hooks and its few dependencies build here, and its cache
  # (saved from dev, like the others) holds just those.
  hooks-32bit:
    name: Hooks 32-bit
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.hooks == 'true') }}
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7

      # Pinned for clippy, as in the Clippy job; the tests run on it too.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy
          targets: i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      - name: cargo test (i686)
        run: cargo test -p goldsrc-hooks --target i686-pc-windows-msvc --locked

      - name: cargo clippy -D warnings (i686)
        run: cargo clippy -p goldsrc-hooks --target i686-pc-windows-msvc --all-targets --locked -- -D warnings

  # Two things nothing checked before a merge: the web analyzer's wasm build
  # (only deploy_web.yml built it, after a push to main) and its node tests
  # (ran nowhere), and the Python that Studio ships in hd-scripts/. Linux,
  # since neither depends on Windows, and it is the quicker runner.
  web-and-python:
    name: Web analyzer and Python
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web_python == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Syntax only, so it needs no packages. All of tools/, not just hd/:
      # it costs nothing and catches a broken probe too.
      - name: Python compiles
        run: python3 -m compileall -q goldsrc-hooks/tools

      # The release-notes collector both release workflows run: a broken
      # parser would only show up when a release is cut.
      - name: Release notes collector tests
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py"

      - name: Web analyzer node tests
        run: node --test web-analyzer/tests/export.test.mjs

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      # The same build and bindings step deploy_web.yml runs, so a PR that
      # would break the deploy fails here instead. A prebuilt wasm-bindgen
      # (seconds) rather than `cargo install` (minutes); its version must
      # match Cargo.lock's wasm-bindgen.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.126

      - name: Build web-analyzer (wasm32, release)
        run: cargo build -p web-analyzer --target wasm32-unknown-unknown --release --locked

      - name: Generate JS bindings
        run: wasm-bindgen --target web --out-dir "$RUNNER_TEMP/pkg" target/wasm32-unknown-unknown/release/web_analyzer.wasm
