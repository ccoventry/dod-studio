name: Release studio (Experimental)

# Manual only, on demand — this is a separate, deliberately lower-friction
# channel for trying dev before it's promoted to main, not a build that fires
# on every push to dev (that would mean a full multi-platform Tauri build on
# every merge). See issue #133 and updater_manager.rs: this republishes a
# single fixed release (tag `experimental-latest`) in place each run, since
# the app's "experimental" update channel polls a fixed URL under that tag,
# not `/releases/latest` (which never resolves to a prerelease).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version this build is heading toward (e.g. 0.11.0 — no leading 'v'); the actual build gets '-<run number>' appended so it always compares as newer than the last experimental build and never collides with a stable release of the same number."
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v7
        with:
          ref: dev

      # The commit actually built. `github.sha` is the commit of the branch the
      # workflow was *started* from (often main), not dev's.
      - name: Record the commit being built
        id: commit
        shell: bash
        run: echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
          targets: i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ". -> target"

      # DoD/GoldSrc is a 32-bit engine, so this companion DLL (see
      # goldsrc-hooks/README.md) needs its own cross-build -- the rest of the
      # app builds for the host's native 64-bit target. Built before
      # tauri-action so tauri.conf.json's `bundle.resources` entry for it
      # already exists on disk when bundling runs.
      - name: Build goldsrc-hooks (32-bit DoD/GoldSrc companion DLL)
        run: cargo build -p goldsrc-hooks --release --target i686-pc-windows-msvc --locked

      # Nothing is published from a tree that fails its tests. `--locked` here
      # and above but not on tauri-action's build: the version stamp below
      # rewrites studio/src-tauri/Cargo.toml, so Cargo.lock no longer matches it.
      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install frontend dependencies
        working-directory: studio
        run: npm ci

      - name: Frontend unit tests
        working-directory: studio
        run: npm run test:unit

      # Same manual, not-committed-back version stamp as release_stable.yml,
      # plus a `-<run number>` suffix — unique per run, always newer than the
      # plain version alone (semver pre-release identifiers sort below the
      # release they're attached to, so this only ever offers itself as an
      # update to someone already on an older experimental build, never to
      # someone on the matching stable release), and monotonically increasing
      # (unlike a git short-sha, which sorts alphabetically, not
      # chronologically).
      # Must be a single, purely-numeric identifier: the MSI/WiX bundler only
      # accepts one pre-release segment and rejects it outright if any part
      # of it isn't numeric — confirmed by two real failed builds, first with
      # `-dev.<short-sha>` ("must be numeric-only ... for msi target"), then
      # again with the two-segment `-dev.<run number>` (still rejected, since
      # the non-numeric `dev` segment is still present — see
      # https://github.com/tauri-apps/tauri/discussions/7600).
      - name: Set experimental build version
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
        run: |
          EXPERIMENTAL_VERSION="${RELEASE_VERSION}-${GITHUB_RUN_NUMBER}"
          node -e "
            const fs = require('fs');
            const version = process.env.EXPERIMENTAL_VERSION;
            for (const path of ['studio/src-tauri/tauri.conf.json', 'studio/package.json']) {
              const json = JSON.parse(fs.readFileSync(path, 'utf8'));
              json.version = version;
              fs.writeFileSync(path, JSON.stringify(json, null, 2) + '\n');
            }
          "
          # tauri.conf.json's version is a display/manifest value only — Rust
          # bakes CARGO_PKG_VERSION into the compiled binary from Cargo.toml,
          # which is what tauri-action actually uses for bundle filenames and
          # the published latest.json, so it needs the same stamp.
          sed -i "s/^version = \".*\"/version = \"${EXPERIMENTAL_VERSION}\"/" studio/src-tauri/Cargo.toml
          echo "EXPERIMENTAL_VERSION=${EXPERIMENTAL_VERSION}" >> "$GITHUB_OUTPUT"

      # As late as possible: the tests, the hook DLL and the frontend install
      # have all passed by here, so a failure that early no longer leaves the
      # experimental channel with no release. Only a failure inside the
      # tauri-action step below still can.
      - name: Delete previous experimental-latest release and tag, if present
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete experimental-latest --yes --cleanup-tag || true

      - name: Build, sign, and publish experimental build
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: studio
          tagName: experimental-latest
          releaseName: "DoD Studio ${{ steps.version.outputs.EXPERIMENTAL_VERSION }} (experimental)"
          releaseBody: "On-demand experimental build from `dev` — not for general use. Built from commit ${{ steps.commit.outputs.SHA }}."
          # What changed, from the merged PRs' titles, grouped by .github/release.yml
          # (#165). releaseBody is prepended to the generated notes.
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: true
