[package]
name = "hl-demo-auditor"
version.workspace = true
edition.workspace = true

[lib]
name = "hl_demo_auditor"
path = "src/lib.rs"

[[bin]]
name = "hl-demo-auditor"
path = "src/main.rs"

[dependencies]
# The delta-continuity check behind `--integrity` (#41).
analysis = { path = "../analysis" }
clap = { workspace = true, features = ["derive"] }
# The key cache file (#888).
serde = { workspace = true }
serde_json = { workspace = true }
# Demos inside .zip files (#929), read only. The same build of zip as
# `native`'s: DEFLATE through flate2's pure-Rust backend, and STORE.
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2"] }
flate2 = "1.1"

# Demos inside .7z and .rar files (#929), read only. 7z opens files by path,
# so it is left out of wasm32 builds, where the library still checks.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Pure Rust, Apache-2.0. COPY, LZMA, LZMA2, BCJ and delta only: no AES, so an
# encrypted 7z is skipped, never asked a password for.
sevenz-rust2 = { version = "0.24.1", default-features = false }

# RARLAB's UnRAR source, built from C++ by `unrar_sys`. It is freeware, not
# open source: it may be used and shipped in any software that reads RAR
# archives, but not to make a RAR-compatible archiver. Its licence paragraph
# is quoted in docs/third_party_notices.md. Windows only, the one platform
# Studio ships on; `--no-default-features` builds without it.
[target.'cfg(windows)'.dependencies]
unrar_sys = { version = "0.5.8", optional = true }

[features]
default = ["rar"]
rar = ["dep:unrar_sys"]

[dev-dependencies]
# Writes the small 7z archives the tests read.
sevenz-rust2 = { version = "0.24.1", default-features = false, features = ["compress"] }

[lints]
workspace = true
