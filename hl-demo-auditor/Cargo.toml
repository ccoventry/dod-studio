[package]
name = "hl-demo-auditor"
version.workspace = true
edition.workspace = true

[lib]
name = "hl_demo_auditor"
path = "src/lib.rs"

[[bin]]
name = "hl-demo-auditor"
path = "src/main.rs"

[dependencies]
# The delta-continuity check behind `--integrity` (#41).
analysis = { path = "../analysis" }
clap = { workspace = true, features = ["derive"] }
# The key cache file (#888).
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
